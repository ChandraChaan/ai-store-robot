<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Robot</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --accent:#1f7a4d; --warn:#b4471b; --line:#e4e1d8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141412; --card:#1f1f1c; --ink:#f1efe9; --muted:#a09e96; --accent:#5ec28f; --warn:#f09055; --line:#33332f; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); padding:16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card h2 { font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; }
  .big { font-size:28px; font-weight:600; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; background:var(--line); }
  .pill.on { background:var(--accent); color:#fff; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:6px 4px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  td.num { text-align:right; font-variant-numeric: tabular-nums; }
  .low { color:var(--warn); font-weight:600; }
  img { width:100%; border-radius:8px; background:#000; aspect-ratio:4/3; object-fit:contain; }
  .log { font-family: ui-monospace, Menlo, monospace; font-size:12px; max-height:320px; overflow:auto; white-space:pre-wrap; }
  .log .robot { color:var(--accent); } .log .customer { font-weight:600; } .log .error { color:var(--warn); }
  button { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:6px; padding:2px 8px; cursor:pointer; }
  input { width:70px; padding:4px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  form { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .kv { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<h1 id="store">Store Robot</h1>
<div class="sub" id="status">connecting…</div>
<div class="grid">
  <div class="card"><h2>Camera</h2><img id="cam" alt="camera"><div id="presence" class="sub" style="margin:8px 0 0"></div></div>
  <div class="card"><h2>Now</h2>
    <div><span id="present" class="pill">nobody</span> <span id="talking" class="pill">quiet</span></div>
    <div class="kv"><span>Customer</span><b id="cname">–</b></div>
    <div class="kv"><span>Cart</span><b id="cart">–</b></div>
    <div class="kv"><span>Visits today</span><b id="visits">0</b></div>
    <div class="kv"><span>Robot</span><b id="robot">–</b></div>
  </div>
  <div class="card"><h2>Today</h2>
    <div class="kv"><span>Cash sales</span><b class="big" id="sales">₹0</b></div>
    <div class="kv"><span>Given on khata</span><b id="credit">₹0</b></div>
    <div class="kv"><span>Khata payments</span><b id="payments">₹0</b></div>
    <div class="kv"><span>Total outstanding</span><b id="outstanding">₹0</b></div>
  </div>
  <div class="card"><h2>Khata (credit book)</h2><table id="khata"></table>
    <form id="payform"><input id="payname" placeholder="name" style="width:120px"><input id="payamt" placeholder="₹" type="number"><button>Record payment</button></form>
  </div>
  <div class="card"><h2>Stock</h2><table id="stock"></table></div>
  <div class="card"><h2>Conversation &amp; events</h2><div class="log" id="log"></div></div>
  <div class="card"><h2>Recent transactions</h2><table id="recent"></table></div>
</div>
<script>
const $ = id => document.getElementById(id);
const rs = v => '₹' + (Math.round(v*100)/100);
async function post(url, body){ const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); return r.json(); }
async function refresh(){
  try {
    const s = await (await fetch('/api/state')).json();
    $('store').textContent = s.store_name + ' · robot dashboard';
    $('status').textContent = 'live · uptime ' + Math.floor(s.uptime_seconds/60) + ' min · ' + new Date().toLocaleTimeString();
    if (s.has_camera) $('cam').src = '/snapshot.jpg?t=' + Date.now();
    $('presence').textContent = s.presence || '';
    const ss = s.session;
    $('present').textContent = ss.customer_present ? 'customer at counter' : 'nobody'; $('present').className = 'pill' + (ss.customer_present?' on':'');
    $('talking').textContent = ss.conversation_active ? 'talking' : 'quiet'; $('talking').className = 'pill' + (ss.conversation_active?' on':'');
    $('cname').textContent = ss.customer_name || '–';
    $('cart').textContent = ss.cart.length ? ss.cart.map(i => i.qty + '× ' + i.name).join(', ') + ' = ' + rs(ss.cart_total) : '–';
    $('visits').textContent = ss.visits_today;
    $('robot').textContent = s.robot ? (s.robot.backend + ' · ' + s.robot.position + (s.robot.busy ? ' · moving' : '')) : 'none';
    $('sales').textContent = rs(s.today.sales); $('credit').textContent = rs(s.today.credit);
    $('payments').textContent = rs(s.today.payments); $('outstanding').textContent = rs(s.today.total_outstanding);
    $('khata').innerHTML = '<tr><th>Customer</th><th>Balance</th></tr>' + (s.balances.map(b => `<tr><td>${b.name}</td><td class="num">${rs(b.balance)}</td></tr>`).join('') || '<tr><td colspan=2>no entries yet</td></tr>');
    $('stock').innerHTML = '<tr><th>Item</th><th>₹</th><th>Stock</th><th></th></tr>' + s.inventory.map(p => `<tr><td>${p.name}<br><small>${p.shelf}</small></td><td class="num">${p.price}</td><td class="num ${p.stock<=p.low_stock?'low':''}">${p.stock} ${p.unit}</td><td><button onclick="post('/api/stock',{key:'${p.key}',delta:-1}).then(refresh)">−</button> <button onclick="post('/api/stock',{key:'${p.key}',delta:1}).then(refresh)">+</button> <button onclick="post('/api/stock',{key:'${p.key}',delta:10}).then(refresh)">+10</button></td></tr>`).join('');
    $('log').innerHTML = s.events.slice().reverse().map(e => `<div class="${e.kind}">${e.time} ${e.kind.padEnd(9)} ${e.text}</div>`).join('');
    $('recent').innerHTML = '<tr><th>Time</th><th>Kind</th><th>Who / item</th><th>₹</th></tr>' + s.recent.map(r => `<tr><td>${new Date(r.created_at*1000).toLocaleTimeString()}</td><td>${r.kind}</td><td>${r.customer||''} ${r.product_key? (r.qty+'× '+r.product_key):''}</td><td class="num">${rs(r.amount)}</td></tr>`).join('');
  } catch (e) { $('status').textContent = 'robot offline: ' + e; }
}
$('payform').addEventListener('submit', async ev => { ev.preventDefault(); const name=$('payname').value.trim(), amount=parseFloat($('payamt').value); if(!name||!(amount>0)) return; await post('/api/payment',{name,amount}); $('payamt').value=''; refresh(); });
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
